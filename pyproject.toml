[project]
name = "code-workflow-emulator"
version = "0.1.0"
description = "Isolated code execution, recording, evaluation and Android device verification for coding agents on Amazon Bedrock AgentCore and EKS"
requires-python = ">=3.11"
dependencies = [
    "bedrock-agentcore>=1.18",
    "boto3>=1.40",
    "anthropic[bedrock]>=1.4",
    "claude-agent-sdk>=0.2.150",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cwe = "cwe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cwe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
